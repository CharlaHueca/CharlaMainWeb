<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CHARLA HUECA | Blog & Podcasts</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Custom CSS -->
  <link rel="stylesheet" href="styles.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              bg: '#F5F2EB',       /* Fondo beige del logo */
              card: '#FFFFFF',     /* Fondo de tarjetas */
              gold: '#C98F39',     /* Letras doradas */
              goldDark: '#A36E22',
              blue: '#3B5266',     /* Cables/pinzas azul metálico */
              blueDark: '#263747',
              text: '#33302B'
            }
          },
          fontFamily: {
            heading: ['Montserrat', 'sans-serif'],
            body: ['Open Sans', 'sans-serif']
          }
        }
      }
    }
  </script>
</head>
<body class="bg-brand-bg text-brand-text font-body min-h-screen flex flex-col">

  <!-- HEADER / NAVBAR -->
  <header class="sticky top-0 z-50 bg-brand-bg/90 backdrop-blur-md border-b border-brand-gold/20 shadow-sm">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
      
      <!-- Logo + Nombre -->
      <a href="#" class="flex items-center gap-3">
        <!-- Reemplaza "logo.png" por la ruta de tu imagen de logo sin fondo -->
        <img src="logo.png" alt="CHARLA HUECA Logo" class="h-12 w-auto object-contain" id="main-logo">
        <span class="font-heading font-extrabold text-xl sm:text-2xl tracking-wider text-brand-blue uppercase">
          Charla <span class="text-brand-gold">Hueca</span>
        </span>
      </a>

      <!-- Navegación -->
      <nav class="hidden md:flex items-center gap-6 font-medium text-brand-blue">
        <a href="#inicio" class="hover:text-brand-gold transition-colors">Inicio</a>
        <a href="#articulos" class="hover:text-brand-gold transition-colors">Artículos</a>
        <a href="#podcast" class="hover:text-brand-gold transition-colors">Episodios</a>
        <a href="#nosotros" class="hover:text-brand-gold transition-colors">Nosotros</a>
      </nav>

      <!-- Búsqueda rápida -->
      <div class="relative">
        <input type="text" id="search-input" placeholder="Buscar temas..." class="pl-9 pr-4 py-1.5 text-sm rounded-full bg-white/80 border border-brand-blue/20 focus:outline-none focus:border-brand-gold transition-all w-36 sm:w-48">
        <i data-lucide="search" class="w-4 h-4 absolute left-3 top-2.5 text-brand-blue/60"></i>
      </div>
    </div>
  </header>

  <!-- HERO SECTION -->
  <section id="inicio" class="py-12 sm:py-16 text-center px-4 max-w-4xl mx-auto">
    <span class="px-4 py-1 rounded-full text-xs font-semibold bg-brand-gold/15 text-brand-goldDark border border-brand-gold/30 uppercase tracking-widest inline-block mb-4">
      Conexión & Conversación
    </span>
    <h1 class="text-4xl sm:text-6xl font-heading font-black text-brand-blue leading-tight mb-4">
      IDEAS QUE <span class="text-brand-gold">RESONAN</span> Y CONECTAN
    </h1>
    <p class="text-lg sm:text-xl text-brand-text/80 max-w-2xl mx-auto mb-8 font-light">
      Un espacio donde las charlas aparentemente sencillas conectan con los pensamientos más profundos.
    </p>
    <div class="flex flex-wrap justify-center gap-4">
      <a href="#articulos" class="px-6 py-3 rounded-xl bg-brand-gold text-white font-semibold hover:bg-brand-goldDark transition-all shadow-md">
        Explorar Lecturas
      </a>
      <a href="#podcast" class="px-6 py-3 rounded-xl bg-brand-blue text-white font-semibold hover:bg-brand-blueDark transition-all shadow-md flex items-center gap-2">
        <i data-lucide="headphones" class="w-4 h-4"></i> Escuchar Podcast
      </a>
    </div>
  </section>

  <!-- FILTROS Y CONTENIDO DE ARTÍCULOS -->
  <main id="articulos" class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1">
    
    <!-- Filtros de categoría -->
    <div class="flex items-center justify-center gap-2 sm:gap-4 mb-10 overflow-x-auto py-2" id="category-filters">
      <button class="filter-btn active" data-cat="todas">Todas</button>
      <button class="filter-btn" data-cat="reflexiones">Reflexiones</button>
      <button class="filter-btn" data-cat="tecnologia">Tecnología</button>
      <button class="filter-btn" data-cat="cultura">Cultura</button>
      <button class="filter-btn" data-cat="podcasts">Podcasts</button>
    </div>

    <!-- Grid de Artículos -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8" id="posts-grid">
      <!-- Generado dinámicamente con JavaScript -->
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="bg-brand-blue text-white border-t border-brand-gold/20 mt-16 py-8">
    <div class="max-w-6xl mx-auto px-4 text-center sm:flex sm:justify-between sm:items-center">
      <p class="text-sm text-white/70">
        © 2026 <span class="text-brand-gold font-bold">CHARLA HUECA</span>. Todos los derechos reservados.
      </p>
      <div class="flex justify-center gap-6 mt-4 sm:mt-0 text-white/80">
        <a href="#" class="hover:text-brand-gold transition-colors"><i data-lucide="twitter" class="w-5 h-5"></i></a>
        <a href="#" class="hover:text-brand-gold transition-colors"><i data-lucide="instagram" class="w-5 h-5"></i></a>
        <a href="#" class="hover:text-brand-gold transition-colors"><i data-lucide="youtube" class="w-5 h-5"></i></a>
        <a href="#" class="hover:text-brand-gold transition-colors"><i data-lucide="rss" class="w-5 h-5"></i></a>
      </div>
    </div>
  </footer>

  <!-- Custom JS -->
  <script src="script.js"></script>
</body>
</html>
